name: dotnet-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MetaGeneticSharp.sln

      - name: Build
        run: dotnet build MetaGeneticSharp.sln --configuration Release --no-restore

      - name: Test (skip System.Drawing tests on Linux - .NET 9 dropped support)
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test MetaGeneticSharp.sln --configuration Release --no-build --verbosity normal

      - name: Test (Linux — exclude System.Drawing.Gdip tests)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet test MetaGeneticSharp.sln --configuration Release --no-build --verbosity normal \
            --filter "FullyQualifiedName!~BilinearHeightMapFunctionTests&FullyQualifiedName!~CustomImageLandscapeTests&FullyQualifiedName!~DirectBitmapTests&FullyQualifiedName!~KnownFunctionLandscapeNdTests&FullyQualifiedName!~KnownFunctionLandscapeNotebookSmokeTests&FullyQualifiedName!~KnownFunctionLandscapeTests&FullyQualifiedName!~LandscapeRendererTests"
