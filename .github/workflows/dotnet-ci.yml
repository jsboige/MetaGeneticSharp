name: dotnet-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install libgdiplus (System.Drawing on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdiplus
          # System.Drawing.Common cherche libgdiplus dans le repertoire runtime .NET
          # utilise par les tests. Comme `dotnet --version` peut renvoyer un SDK pre-installed
          # (.NET 10 ici) sans runtime .NET 9 correspondant, on liste les runtimes Microsoft.NETCore.App
          # et on symlinke dans chaque repertoire .x.y.z pour couvrir celui utilise par les tests net9.0.
          for runtime_dir in /usr/share/dotnet/shared/Microsoft.NETCore.App/*/; do
            for src in /usr/lib/x86_64-linux-gnu/libgdiplus*.so*; do
              [ -e "$src" ] || continue
              sudo ln -sf "$src" "${runtime_dir}$(basename "$src")"
            done
          done
          ls -la /usr/share/dotnet/shared/Microsoft.NETCore.App/*/libgdiplus* | head -10

      - name: Restore
        run: dotnet restore MetaGeneticSharp.sln

      - name: Build
        run: dotnet build MetaGeneticSharp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MetaGeneticSharp.sln --configuration Release --no-build --verbosity normal
