name: dotnet-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install libgdiplus (System.Drawing on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdiplus
          # System.Drawing.Common cherche libgdiplus dans $DOTNET_ROOT/shared/Microsoft.NETCore.App/<ver>/
          # mais apt l'installe sous /usr/lib/x86_64-linux-gnu/. On symlink pour rendre la lib visible
          # au loader .NET.
          DOTNET_VER=$(dotnet --version)
          RUNTIME_DIR="/usr/share/dotnet/shared/Microsoft.NETCore.App/$DOTNET_VER"
          for src in /usr/lib/x86_64-linux-gnu/libgdiplus*.so*; do
            [ -e "$src" ] || continue
            sudo ln -sf "$src" "$RUNTIME_DIR/$(basename "$src")"
          done
          ls -la "$RUNTIME_DIR/libgdiplus"*

      - name: Restore
        run: dotnet restore MetaGeneticSharp.sln

      - name: Build
        run: dotnet build MetaGeneticSharp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MetaGeneticSharp.sln --configuration Release --no-build --verbosity normal
